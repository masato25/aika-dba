database:
  type: "postgres"
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres"
  dbname: "mydatabase"

app:
  name: "aika-dba"
  version: "1.0.0"
  port: 8080
  host: "localhost"

schema:
  output_file: "schema_output.json"
  max_samples: 100
  timeout_seconds: 60

llm:
  provider: "llamacpp"
  model: "mistral-7b"
  host: "localhost"
  port: 8080
  timeout_seconds: 120
  context_size: 4096
  max_tokens: 2048
  temperature: 0.7
  top_p: 0.9
  top_k: 40
  stop_words:
    - "</s>"
    - "\n\n"

vectorstore:
  enabled: true
  database_path: "./data/vectorstore"
  embedder_type: "qwen"
  qwen_model_path: "./models/qwen"
  embedding_dimension: 1024
  chunk_size: 512
  chunk_overlap: 128

security:
  enable_sql_sandbox: true
  max_query_time: 30
  allowed_tables:
    - "public.*"

logging:
  level: "info"
  format: "json"
  output: "file"
  file_path: "./logs/app.log"