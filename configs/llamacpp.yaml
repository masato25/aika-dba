# LlamaCpp LLM 和 Vector Store 配置
llm:
  provider: "llamacpp"
  model: "mistral-7b"
  host: "localhost"
  port: 8080
  timeout_seconds: 120
  context_size: 16384
  max_tokens: 2048
  temperature: 0.7
  top_p: 0.9
  top_k: 40
  stop_words:
    - "</s>"
    - "\n\n"

vectorstore:
  enabled: true
  database_path: "./data/vectorstore"
  embedder_type: "simple"
  embedding_dimension: 512
  chunk_size: 512
  chunk_overlap: 128